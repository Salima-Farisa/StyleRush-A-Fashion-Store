{% extends "admin_app/base.html" %}
{% block title %}Edit Discount{% endblock %}
{% block 'content' %}

<div class="container mt-4">
    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="text-light">Product Variant:</label>
            <p class="text-warning fw-bold">
                {{ discount.variant.product.name }} - {{ discount.variant.color.name }} / {{ discount.variant.size.size }}
            </p>
        </div>

        <div class="mb-3">
            <label class="text-light">Discount Percent:</label>
            <input type="number" name="percent" min="1" max="90" class="form-control"
                   value="{{ discount.percent }}" required>
        </div>

        <div class="mb-3">
            <label class="text-light">Start Date:</label>
            <input type="datetime-local" name="start_date" class="form-control"
                   value="{{ discount.start_date|date:'Y-m-d\\TH:i' }}" required>
        </div>

        <div class="mb-3">
            <label class="text-light">End Date:</label>
            <input type="datetime-local" name="end_date" class="form-control"
                   value="{{ discount.end_date|date:'Y-m-d\\TH:i' }}">
        </div>

        <div class="form-check mb-3">
            <input class="form-check-input" type="checkbox" name="active" {% if discount.active %}checked{% endif %}>
            <label class="form-check-label text-light">Active</label>
        </div>

        <button class="btn btn-success">Update</button>
    </form>
</div>

{% endblock %}
