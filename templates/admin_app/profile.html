{% extends "admin_app/base.html" %}
{% load static %}

{% block 'content' %}

<section class="profile-section py-5">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card shadow border-0 rounded-4 overflow-hidden">
                    <div class="card-header bg-dark text-white d-flex justify-content-between align-items-center">
                        <h5 class="mb-0"><i class="bi bi-person-circle me-2"></i> My Profile</h5>
                        <a href="{% url 'admin_edit_profile' %}" class="btn btn-light btn-sm"><i class="bi bi-pencil-square me-1"></i> Edit</a>
                    </div>

                    <div class="card-body p-4">
                        <div class="d-flex align-items-center mb-4">
                            {% if customer.profile_image %}
                                <img src="{{ customer.profile_image.url }}" class="rounded-circle me-3" width="90" height="90" alt="Profile Image">
                            {% else %}
                                <img src="{% static 'images/default-profile.png' %}" class="rounded-circle me-3" width="90" height="90" alt="Profile Image">
                            {% endif %}
                            <div>
                                <h5 class="mb-1">{{ user.first_name }} {{ user.last_name }}</h5>
                                <p class="text-light mb-0">{{ user.email }}</p>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-md-6">
                                <p><strong>Username:</strong> {{ user.username }}</p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
