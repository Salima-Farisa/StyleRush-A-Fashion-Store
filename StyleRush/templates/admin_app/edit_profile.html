{% extends "admin_app/base.html" %}
{% load static %}
{% block 'content' %}

<section class="py-5 profile-section">
    <div class="container">
        <div class="row justify-content-center">
            <div class="col-lg-6">
                <div class="card shadow border-0 rounded-4">
                    <div class="card-header bg-dark text-white">
                        <h5 class="mb-0"><i class="bi bi-pencil me-2"></i> Edit Profile</h5>
                    </div>

                    <div class="card-body bg-light p-4">
                        <form method="POST" enctype="multipart/form-data">
                            {% csrf_token %}
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <label class="form-label">First Name</label>
                                    <input type="text" name="first_name" class="form-control" value="{{ user.first_name }}">
                                </div>
                                <div class="col-md-6">
                                    <label class="form-label">Last Name</label>
                                    <input type="text" name="last_name" class="form-control" value="{{ user.last_name }}">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Email</label>
                                    <input type="email" name="email" class="form-control" value="{{ user.email }}">
                                </div>
                                <div class="col-md-12">
                                    <label class="form-label">Profile Image</label>
                                    <input type="file" name="profile_image" class="form-control">
                                    {% if customer.profile_image %}
                                        <small class="text-muted">Current: {{ customer.profile_image.name }}</small>
                                    {% endif %}
                                </div>
                            </div>

                            <div class="text-end mt-4">
                                <a href="{% url 'admin_profile' %}" class="btn btn-outline-secondary">Cancel</a>
                                <button type="submit" class="btn btn-dark">Save Changes</button>
                            </div>
                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>
</section>

{% endblock %}
